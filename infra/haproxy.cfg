global
    log stdout format raw local0
    maxconn 256
defaults
    log global
    timeout connect 2s
    timeout client 30s
    timeout server 5s
    timeout tunnel 1h
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
frontend http_l7
    bind :8080
    mode http
    option httplog
    default_backend orders_http
backend orders_http
    mode http
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    server orders1 app:8000 check inter 1s fall 2 rise 1 resolvers docker init-addr libc,none
    server orders2 app2:8000 check inter 1s fall 2 rise 1 resolvers docker init-addr libc,none
frontend tcp_l4
    bind :8081
    mode tcp
    option tcplog
    default_backend orders_tcp
backend orders_tcp
    mode tcp
    balance roundrobin
    server orders1 app:8000 check inter 1s fall 2 rise 1 resolvers docker init-addr libc,none
    server orders2 app2:8000 check inter 1s fall 2 rise 1 resolvers docker init-addr libc,none
