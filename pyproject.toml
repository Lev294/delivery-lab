[project]
name = "delivery-lab"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "grpcio==1.84.0",
    "protobuf==7.36.2",
    "psycopg[binary,pool]==3.3.5",
    "uvicorn==0.53.0",
    "websockets==17.1",
]

[dependency-groups]
dev = [
    "grpcio-tools==1.84.0",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["delivery/rpc/*_pb2.py", "delivery/rpc/*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
